[tool.pytest.ini_options]
pythonpath = ["pipeline"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["db", "geo", "geoclient", "geocode", "ingest", "locations", "named_features",
                     "socrata", "street_lines", "streets"]
