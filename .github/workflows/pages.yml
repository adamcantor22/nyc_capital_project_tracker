name: Pages

on:
  push:
    branches: [main]
    paths: [web/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # The export lives in the newest data-* release (scripts/publish_data.sh), not in the repo.
      - name: Add the exported data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("data-"))][0].tagName')
          test -n "$tag"
          gh release download "$tag" --pattern export.tar.gz --dir "$RUNNER_TEMP"
          mkdir -p web/dist/data
          tar -xzf "$RUNNER_TEMP/export.tar.gz" -C web/dist/data
          echo "Deployed data from $tag"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
